<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Platform Login | KitchenX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/kitchenx-type.css" />
  <style>
    :root { --orange: #FF4F18; --ink: #141517; --muted: #667085; --line: #E4E7EC; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font-secondary, "Source Sans 3"), ui-sans-serif, system-ui, sans-serif;
      color: var(--ink); background: #FFFAF7; overflow-x: hidden; position: relative;
    }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg i { position: absolute; border-radius: 50%; }
    .bg .b1 { width: 460px; height: 460px; right: -190px; top: -260px; background: radial-gradient(circle at 40% 60%, #FFD9B8, #FFE9D6 70%); }
    .bg .b2 { width: 620px; height: 620px; right: -340px; top: -170px; background: #FFF1E6; opacity: .7; }
    .bg .b3 { width: 440px; height: 440px; left: -230px; bottom: -240px; background: radial-gradient(circle at 70% 30%, #FFD2AE, #FFE6D3 70%); }
    .bg .b4 { width: 320px; height: 320px; left: -150px; bottom: -100px; background: #FFF1E6; opacity: .8; }

    .page {
      position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 16px;
    }
    .logo-link { display: block; line-height: 0; }
    .logo { width: 210px; max-width: 70vw; height: auto; display: block; }

    .card-wrap { width: 100%; max-width: 420px; margin-top: 28px; }
    .card { background: #fff; border-radius: 22px; padding: 30px 32px 26px; box-shadow: 0 16px 44px rgba(255, 120, 60, 0.10), 0 2px 8px rgba(20, 21, 23, 0.04); }
    .card h2 { margin: 0; text-align: center; font-family: var(--font-primary, "Inter Tight"), ui-sans-serif, system-ui, sans-serif; font-size: 25px; font-weight: 800; letter-spacing: -0.02em; }
    .card .sub { margin: 5px 0 0; text-align: center; font-size: 14px; color: var(--muted); }
    form { margin-top: 22px; display: grid; gap: 2px; }
    label.lbl { display: block; margin: 8px 0 6px; font-size: 14px; font-weight: 700; }
    .input { position: relative; }
    .input > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #475467; pointer-events: none; }
    .input input {
      width: 100%; height: 48px; padding: 0 46px 0 44px; border: 1px solid var(--line); border-radius: 14px; background: #F8F9FB;
      font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .input input::placeholder { color: #98A2B3; }
    .input input:focus { background: #fff; border-color: rgba(255, 79, 24, 0.7); box-shadow: 0 0 0 4px rgba(255, 79, 24, 0.12); }
    .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: #475467; cursor: pointer; border-radius: 50%; }
    .eye:hover { color: var(--orange); }
    .err { margin: 8px 0 0; font-size: 14px; font-weight: 700; color: var(--orange); }
    .err[hidden] { display: none; }
    .btn { margin-top: 16px; height: 48px; width: 100%; border: 0; border-radius: 999px; background: var(--orange); color: #fff; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 18px rgba(255, 79, 24, 0.26); transition: transform .1s, box-shadow .15s; }
    .btn:hover { box-shadow: 0 10px 22px rgba(255, 79, 24, 0.34); }
    .btn:active { transform: translateY(1px); }
    .or { display: flex; align-items: center; gap: 12px; margin-top: 20px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .note { margin: 14px 0 0; text-align: center; font-size: 13px; line-height: 1.55; color: var(--muted); }

    /* Phones and tablets: plain background, just the logo and the form */
    @media (max-width: 1023px) {
      body { background: #F7F8FA; }
      .bg { display: none; }
      .card { padding: 26px 20px 22px; box-shadow: 0 1px 3px rgba(20, 21, 23, 0.06), 0 8px 24px rgba(20, 21, 23, 0.05); }
    }
    @media (min-width: 600px) and (max-width: 1023px) {
      .card { padding: 30px 32px 26px; }
    }
    @media (max-width: 359px) {
      .page { padding: 24px 12px; }
      .card { padding: 22px 16px 20px; }
      .input input { padding-left: 40px; padding-right: 40px; }
      .input > svg { left: 12px; }
    }
    /* Short screens (landscape phones, small laptops): start at the top and scroll if needed */
    @media (max-height: 640px) {
      .page { justify-content: flex-start; padding-top: 20px; }
      .card-wrap { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

  <main class="page">
    <a class="logo-link" href="kitchenx-v2.html" aria-label="KitchenX home"><img class="logo" src="assets/home/kitchenx-logo-lg.webp" width="720" height="84" alt="KitchenX" /></a>

    <div class="card-wrap">
      <section class="card">
        <h2>Platform Login</h2>
        <p class="sub">Sign in to access the KitchenX platform</p>

        <form id="loginForm" autocomplete="off" novalidate>
          <label class="lbl" for="userInput">Work email</label>
          <div class="input">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
            <input id="userInput" type="text" placeholder="Enter your work email" autocomplete="username" autocapitalize="off" spellcheck="false" />
          </div>

          <label class="lbl" for="passInput">Password</label>
          <div class="input">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15.5" r="1"/></svg>
            <input id="passInput" type="password" placeholder="Enter your password" autocomplete="current-password" />
            <button type="button" class="eye" id="eyeBtn" aria-label="Show password"></button>
          </div>

          <p id="formError" class="err" role="alert" hidden></p>
          <button type="submit" class="btn">Sign in</button>
        </form>

        <div class="or">or</div>
        <p class="note">Accounts are created by a platform admin.<br />Contact your admin to get access.</p>
      </section>
    </div>

  </main>

  <script>
    const STAFF = {
      admin: { user: 'Admin', pass: 'Admin@123', role: 'admin', persona: 'platform', href: 'admin.html' },
      finance: { user: 'FinanceAdmin', pass: 'FinanceAdmin@123', role: 'admin', persona: 'finance', href: 'finance.html' },
      technical: { user: 'TechnicalAdmin', pass: 'TechnicalAdmin@123', role: 'admin', persona: 'technical', href: 'technical.html' },
      rm: { user: 'RM', pass: 'RM@123', role: 'admin', persona: 'rm', href: 'rm.html', alts: [{ user: 'RelationshipManager', pass: 'RelationshipManager@123' }] },
      supervisor: { user: 'Supervisor', pass: 'Supervisor@123', role: 'warehouse', persona: 'warehouse_supervisor', href: 'warehouse.html' },
      manager: { user: 'Manager', pass: 'Manager@123', role: 'warehouse', persona: 'warehouse_manager', href: 'warehouse.html' }
    };
    const eyeOpen = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    const eyeOff = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-4.4"/><path d="M9.9 5.2A11 11 0 0 1 12 5c6 0 10 7 10 7a18 18 0 0 1-3.2 3.6"/><path d="M6.1 6.1A18 18 0 0 0 2 12s4 7 10 7a10.4 10.4 0 0 0 4.2-.9"/></svg>';

    function staffHome() {
      const role = sessionStorage.getItem('kxRole');
      const persona = sessionStorage.getItem('kxPersona') || '';
      if (!sessionStorage.getItem('kxUser')) return '';
      if (role === 'warehouse') return 'warehouse.html';
      if (role === 'admin') {
        if (persona === 'finance') return 'finance.html';
        if (persona === 'technical') return 'technical.html';
        if (persona === 'rm') return 'rm.html';
        if (persona.indexOf('warehouse') === 0) return 'warehouse.html';
        if (persona === 'platform' || persona === 'admin') return 'admin.html';
      }
      return '';
    }
    const home = staffHome();
    if (home) location.replace(home);

    const passInput = document.getElementById('passInput');
    const eyeBtn = document.getElementById('eyeBtn');
    const formError = document.getElementById('formError');
    eyeBtn.innerHTML = eyeOpen;
    eyeBtn.addEventListener('click', () => {
      const show = passInput.type === 'password';
      passInput.type = show ? 'text' : 'password';
      eyeBtn.innerHTML = show ? eyeOff : eyeOpen;
      eyeBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    function fail(msg) {
      formError.textContent = msg;
      formError.hidden = false;
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('userInput').value.trim();
      const pass = passInput.value;
      formError.hidden = true;
      if (!user || !pass) return fail('Enter both fields to continue.');
      const key = user.toLowerCase();
      const staff = Object.values(STAFF).find((s) => {
        if (s.user.toLowerCase() === key && s.pass === pass) return true;
        return (s.alts || []).some((a) => a.user.toLowerCase() === key && a.pass === pass);
      });
      if (!staff) return fail('Email or password is incorrect.');
      sessionStorage.setItem('kxRole', staff.role);
      sessionStorage.setItem('kxPersona', staff.persona);
      sessionStorage.setItem('kxUser', staff.user);
      location.replace(staff.href);
    });
  </script>
</body>
</html>
